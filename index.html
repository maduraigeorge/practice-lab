<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Practice Lab – Python &amp; SQL</title>
<style>
:root { --bg:#f4f5f8; --panel:#fff; --text:#1d2230; --muted:#6b7385; --border:#dfe2ea; --accent:#3b6df0; --chip:#eceef5; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#12141b; --panel:#1b1e28; --text:#e6e8ef; --muted:#8a92a6; --border:#2c3040; --accent:#6f94ff; --chip:#272b3a; }
}
* { box-sizing:border-box; }
html, body { margin:0; height:100%; height:100dvh; background:var(--bg); color:var(--text);
  font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
body { display:flex; flex-direction:column; overflow:hidden; }
.top { display:flex; align-items:center; gap:14px; padding:8px 16px; padding-top:max(8px, env(safe-area-inset-top)); flex:none;
  background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:wrap; }
.brand { display:flex; align-items:baseline; gap:8px; }
.brand b { font-size:17px; letter-spacing:.2px; }
.brand span { color:var(--muted); font-size:12.5px; }
.brand span em { font-style:normal; color:var(--accent); font-weight:600; }
.tabs { display:flex; gap:4px; background:var(--chip); padding:3px; border-radius:11px; }
.tabs button { font:inherit; border:0; background:none; color:var(--muted); padding:6px 16px; border-radius:8px; cursor:pointer; font-weight:600; }
.tabs button:hover { color:var(--text); }
.tabs button.on { background:var(--accent); color:#fff; }
.spacer { flex:1; }
.tip { color:var(--muted); font-size:12.5px; }
.stage { flex:1; min-height:0; position:relative; }
iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--bg); display:none; color-scheme:light dark; }
iframe.on { display:block; }
.foot { flex:none; text-align:center; font-size:12px; color:var(--muted); padding:4px 8px; padding-bottom:max(4px, env(safe-area-inset-bottom));
  border-top:1px solid var(--border); background:var(--panel); }
.foot b { color:var(--accent); font-weight:600; }
@media (max-width:700px) {
  .top { gap:8px; padding:6px 10px; } .tip { display:none; } .brand span { display:none; }
  .tabs { flex:1; } .tabs button { flex:1; padding:8px 6px; }
}
@media (max-height:520px) { .foot { display:none; } .top { padding-top:4px; padding-bottom:4px; } }
</style>
</head>
<body>
<div class="top">
  <div class="brand"><b>🧪 Practice Lab</b><span>by <em>@maduraigeorge</em></span></div>
  <div class="tabs" role="tablist">
    <button role="tab" data-t="python" id="tb-python">🐍 Python</button>
    <button role="tab" data-t="sql" id="tb-sql">🗄️ SQL</button>
  </div>
  <span class="spacer"></span>
  <span class="tip" id="tip"></span>
</div>
<div class="stage">
  <iframe id="fr-python" title="Python lab" data-src="python.html?embed=1"></iframe>
  <iframe id="fr-sql" title="SQL lab" data-src="sql.html?embed=1"></iframe>
</div>
<div class="foot">Practice Lab · crafted by <b>@maduraigeorge</b></div>

<script>
const TIPS = { python: 'Write Python – see every step, the variables and the output live.',
               sql: 'Connect a PostgreSQL / MySQL DB, or create a schema / upload an image – then practise SQL.' };
function show(t) {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  document.querySelectorAll('iframe').forEach(f => {
    const on = f.id === 'fr-' + t; f.classList.toggle('on', on);
    if (on && !f.src) f.src = f.dataset.src;
  });
  $tip.textContent = TIPS[t];
  document.title = (t === 'sql' ? 'SQL' : 'Python') + ' · Practice Lab – @maduraigeorge';
  try { localStorage.setItem('lab.tab', t); } catch (e) {}
  if (location.hash !== '#' + t) history.replaceState(null, '', '#' + t);
}
const $tip = document.getElementById('tip');
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => show(b.dataset.t));
document.addEventListener('keydown', e => { if (e.altKey && e.key === '1') show('python'); if (e.altKey && e.key === '2') show('sql'); });
let start = location.hash.slice(1);
if (!['python', 'sql'].includes(start)) { try { start = localStorage.getItem('lab.tab'); } catch (e) {} }
show(start === 'sql' ? 'sql' : 'python');
</script>
</body>
</html>
